<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Inter', 'Noto Sans', sans-serif">
  <defs>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4F46E5" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0D9488" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D97706" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF" />

  <!-- Title Banner -->
  <rect x="20" y="14" width="860" height="44" rx="6" fill="#0F172A" />
  <text x="450" y="34" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">CHAPTER 10 DECISION TREE: SPONSORSHIP NEGOTIATION &amp; FRIDAY CEO KPI GOVERNANCE</text>
  <text x="450" y="50" fill="#CBD5E1" font-size="10" font-weight="500" text-anchor="middle">Inbound/Outbound Deal Routing, Usage-Rights Multiplier Enforcement &amp; Weekly Burnout Protection Gates</text>

  <!-- Gate 1: Sponsorship Offer Evaluation -->
  <rect x="30" y="76" width="245" height="74" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <rect x="30" y="76" width="245" height="22" rx="4" fill="#0F172A" />
  <text x="152" y="91" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">GATE 1: SPONSOR OFFER vs FLOOR</text>
  <text x="152" y="111" fill="#1E293B" font-size="9.5" font-weight="600" text-anchor="middle">Compare Brand Budget to R_sponsor</text>
  <text x="152" y="126" fill="#4F46E5" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Floor: Base = Video + Email CPC</text>
  <text x="152" y="141" fill="#64748B" font-size="8.5" text-anchor="middle">Never Discount Rate Without Removing Scope</text>

  <!-- Lowball Branch Gate 1 -->
  <path d="M 275 113 L 330 113" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="302" y="106" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">&lt; FLOOR</text>
  <rect x="335" y="76" width="255" height="74" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" />
  <text x="462" y="95" fill="#B45309" font-size="10" font-weight="700" text-anchor="middle">SCOPE-REDUCTION COUNTEROFFER</text>
  <text x="462" y="111" fill="#1E293B" font-size="9" text-anchor="middle">1. Hold per-deliverable rate integrity</text>
  <text x="462" y="125" fill="#1E293B" font-size="9" text-anchor="middle">2. Strip YouTube slot -&gt; Offer Newsletter Only</text>
  <text x="462" y="139" fill="#64748B" font-size="8.5" text-anchor="middle">3. Or add CPC performance bonus above cap</text>

  <!-- Pass Branch Gate 1 -> Gate 2 -->
  <path d="M 152 150 L 152 178" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <text x="186" y="168" fill="#0D9488" font-size="8.5" font-weight="700">&gt;= FLOOR</text>

  <!-- Gate 2: Usage Rights & Exclusivity Audit -->
  <rect x="30" y="182" width="245" height="76" rx="6" fill="#F8FAFC" stroke="#4F46E5" stroke-width="2" />
  <rect x="30" y="182" width="245" height="22" rx="4" fill="#4F46E5" />
  <text x="152" y="197" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">GATE 2: CONTRACT IP &amp; USAGE AUDIT</text>
  <text x="152" y="217" fill="#1E293B" font-size="9.5" font-weight="600" text-anchor="middle">Inspect Paid Ad &amp; Exclusivity Clauses</text>
  <text x="152" y="232" fill="#4F46E5" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Apply M_usage (1.3x-2.0x) &amp; M_excl</text>
  <text x="152" y="247" fill="#64748B" font-size="8.5" text-anchor="middle">Require 50% Deposit Upon Signature</text>

