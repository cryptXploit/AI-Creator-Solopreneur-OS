  <text x="152" y="325" fill="#1E293B" font-size="9.5" font-weight="600" text-anchor="middle">Deliver Verified Impressions + Clicks</text>
  <text x="152" y="340" fill="#0D9488" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">Check: Clicks &gt;= Guaranteed Target</text>
