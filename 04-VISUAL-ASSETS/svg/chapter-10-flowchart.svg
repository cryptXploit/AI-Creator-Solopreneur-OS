  <text x="462" y="309" fill="#B45309" font-size="10" font-weight="700" text-anchor="middle">PROACTIVE MAKE-GOOD PROTOCOL</text>
  <text x="462" y="325" fill="#1E293B" font-size="9" text-anchor="middle">1. Never wait for sponsor complaint</text>
  <text x="462" y="339" fill="#1E293B" font-size="9" text-anchor="middle">2. Add bonus newsletter slot at $0 charge</text>
  <text x="462" y="353" fill="#64748B" font-size="8.5" text-anchor="middle">3. Preserves trust &amp; renewal eligibility</text>

  <!-- Pass Branch Gate 3 -> Gate 4 -->
  <path d="M 152 366 L 152 392" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow-indigo)" />
  <text x="188" y="383" fill="#4F46E5" font-size="8.5" font-weight="700">FRIDAY AUDIT</text>

