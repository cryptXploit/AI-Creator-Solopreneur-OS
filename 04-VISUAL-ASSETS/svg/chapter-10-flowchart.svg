  <rect x="615" y="76" width="265" height="26" rx="4" fill="#0F172A" />
  <text x="747" y="93" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">SOLOPRENEUR OS MASTER SCORECARD</text>

  <text x="630" y="118" fill="#4F46E5" font-size="9.5" font-weight="700">1. Acquisition &amp; Retention (Ch 1-5)</text>
  <text x="630" y="134" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Outlier Score (OS): &gt;= 2.5x Median</text>
  <text x="630" y="148" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- 30s Hook Hold:      &gt;= 70.0%</text>
  <text x="630" y="162" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Full AVD:           &gt;= 50.0%</text>

  <line x1="630" y1="172" x2="865" y2="172" stroke="#CBD5E1" stroke-width="1" />
  <text x="630" y="190" fill="#4F46E5" font-size="9.5" font-weight="700">2. Production &amp; Velocity (Ch 6-7)</text>
  <text x="630" y="206" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Repurposing Ratio:  1 Pillar -&gt; 15 Assets</text>
  <text x="630" y="220" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Evergreen Buffer:   &gt;= 3 Weeks Queued</text>
  <text x="630" y="234" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Weekly Studio Cap:  &lt;= 22 - 25 Hours</text>

  <line x1="630" y1="244" x2="865" y2="244" stroke="#CBD5E1" stroke-width="1" />
  <text x="630" y="262" fill="#0D9488" font-size="9.5" font-weight="700">3. Owned Funnel &amp; Products (Ch 8-9)</text>
  <text x="630" y="278" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Opt-In Page CVR:    45.0% - 62.0%</text>
  <text x="630" y="292" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- 90-Day V_sub:       $3.50 - $8.40+</text>
  <text x="630" y="306" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Checkout AOV Lift:  +45% via Bump/Upsell</text>

  <line x1="630" y1="316" x2="865" y2="316" stroke="#CBD5E1" stroke-width="1" />
  <text x="630" y="334" fill="#D97706" font-size="9.5" font-weight="700">4. Sponsorships &amp; Profit (Ch 10)</text>
  <text x="630" y="350" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Outbound Pitches:   5 Targeted / Week</text>
  <text x="630" y="364" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Retainer Renewal:   40.0% - 60.0%</text>
  <text x="630" y="378" fill="#1E293B" font-size="8.5" font-family="'JetBrains Mono', monospace">- Net Operating Margin: 80.0% - 92.0%</text>

  <rect x="630" y="394" width="235" height="56" rx="6" fill="#0D9488" />
  <text x="747" y="416" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">CREATOR OS FULLY INSTALLED</text>
  <text x="747" y="432" fill="#FFFFFF" font-size="8.5" text-anchor="middle">$15k-$40k+/Mo Diversified Solopreneur</text>
  <text x="747" y="445" fill="#E2E8F0" font-size="8" text-anchor="middle">Zero Algorithm Fragility | Zero Burnout</text>
</svg>
