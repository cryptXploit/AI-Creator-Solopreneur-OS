  <rect x="30" y="396" width="245" height="68" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <rect x="30" y="396" width="245" height="22" rx="4" fill="#0F172A" />
  <text x="152" y="411" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">GATE 4: FRIDAY CREATOR CEO AUDIT</text>
  <text x="152" y="431" fill="#1E293B" font-size="9.5" font-weight="600" text-anchor="middle">Audit Weekly Hours &amp; Effective $/Hr</text>
  <text x="152" y="446" fill="#0D9488" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">Cap: Hours &lt;= 25 | Margin &gt;= 80%</text>
  <text x="152" y="459" fill="#64748B" font-size="8.5" text-anchor="middle">Enforce 1-Task Elimination Rule</text>

  <path d="M 275 430 L 330 430" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)" />
  <rect x="335" y="396" width="255" height="68" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8" />
  <text x="462" y="415" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">BOTTLENECK &amp; BURNOUT SHIELD</text>
  <text x="462" y="431" fill="#1E293B" font-size="9" text-anchor="middle">If Hrs &gt; 25: Automate or Delegate 1 SOP</text>
  <text x="462" y="445" fill="#1E293B" font-size="9" text-anchor="middle">Maintain &gt;= 3-Week Evergreen Content Buffer</text>
  <text x="462" y="458" fill="#0D9488" font-size="8.5" font-weight="700" text-anchor="middle">Compounds Solopreneur Enterprise Value</text>

  <!-- Right Panel: Full Creator OS Master Telemetry -->
