  <path d="M 275 220 L 330 220" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="302" y="213" fill="#D97706" font-size="8.5" font-weight="700" text-anchor="middle">IP TRAP</text>
  <rect x="335" y="182" width="255" height="76" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" />
  <text x="462" y="201" fill="#B45309" font-size="10" font-weight="700" text-anchor="middle">REDLINE &amp; SEPARATE LINE-ITEM</text>
  <text x="462" y="217" fill="#1E293B" font-size="9" text-anchor="middle">1. Strike "in perpetuity" paid ad clauses</text>
  <text x="462" y="231" fill="#1E293B" font-size="9" text-anchor="middle">2. Quote 30-day whitelisting at +30% fee</text>
  <text x="462" y="245" fill="#64748B" font-size="8.5" text-anchor="middle">3. Cap script revisions at 1 factual pass</text>

