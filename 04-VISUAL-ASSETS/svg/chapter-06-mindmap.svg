<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Pure White Canvas -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <rect x="10" y="10" width="880" height="460" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="10" y="10" width="880" height="48" rx="8" fill="#0F172A"/>
  <text x="28" y="33" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 06 SYSTEM MINDMAP: THE 1-TO-15 OMNICHANNEL REPURPOSING WATERFALL</text>
  <text x="28" y="49" fill="#94A3B8" font-size="10.5" font-weight="500">Part III — Repurposing Engine | Core Formula: CMLR = Sum(A_i x PNFW_i) / (H_pillar + H_repurpose) &gt;= 3.50 Assets/Hour</text>
  <rect x="730" y="21" width="144" height="26" rx="4" fill="#0D9488"/>
  <text x="802" y="38" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">1 PILLAR -&gt; 15 ASSETS</text>

  <!-- Connecting Bezier Curves from Center Node (450, 250) -->
  <!-- Top-Left Branch (Assets 01-03 Vertical Video) -->
  <path d="M 350 225 C 305 225, 290 140, 255 140" fill="none" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
  <!-- Bottom-Left Branch (Assets 04-07 Carousels & Threads) -->
  <path d="M 350 275 C 305 275, 290 348, 255 348" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <!-- Top-Right Branch (Assets 08-13 Text Posts & Notes) -->
  <path d="M 550 225 C 595 225, 610 140, 645 140" fill="none" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
  <!-- Bottom-Right Branch (Assets 14-15 Newsletter + Audio) -->
  <path d="M 550 275 C 595 275, 610 348, 645 348" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- CENTRAL ROOT NODE -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="196" width="200" height="110" rx="10" fill="#0F172A" stroke="#4F46E5" stroke-width="2.5"/>
    <rect x="370" y="206" width="160" height="20" rx="4" fill="#4F46E5"/>
    <text x="450" y="220" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">SOURCE ANCHOR ASSET</text>
    <text x="450" y="242" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">1x H.E.A.R.T. Pillar</text>
    <text x="450" y="259" fill="#FFFFFF" font-size="11.5" font-weight="600" text-anchor="middle">(12–18m Video / Essay)</text>
    <text x="450" y="278" fill="#CBD5E1" font-size="9.5" text-anchor="middle">Timecoded Transcript (.SRT)</text>
    <text x="450" y="294" fill="#0D9488" font-size="9.5" font-weight="700" text-anchor="middle">90-Min Extraction Sprint</text>
  </g>

  <!-- BRANCH 1 (TOP-LEFT): TIER 1 VERTICAL VIDEO DERIVATIVES (ASSETS 01-03) -->
  <g filter="url(#card-shadow)">
    <rect x="25" y="72" width="230" height="142" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="25" y="72" width="230" height="28" rx="6" fill="#4F46E5"/>
    <text x="35" y="90" fill="#FFFFFF" font-size="10.5" font-weight="700">1. VERTICAL VIDEO (ASSETS 01–03)</text>
    <text x="35" y="115" fill="#0F172A" font-size="10" font-weight="700">• 3x 9:16 Short-Form Clips (35–58s):</text>
    <text x="43" y="129" fill="#1E293B" font-size="9.5">Reels, TikTok, YouTube Shorts (1080x1920)</text>
    <text x="43" y="143" fill="#64748B" font-size="9">1. Contrarian Hook | 2. Micro-SOP | 3. Proof</text>
    <text x="35" y="162" fill="#0F172A" font-size="10" font-weight="700">• Native Translation Rules (PNFW=1.0):</text>
    <text x="43" y="176" fill="#1E293B" font-size="9.5">Zero 0.0s intro air; dynamic safe-zone subs</text>
    <text x="43" y="190" fill="#D97706" font-size="9" font-weight="600">Seamless syntactic loop back to 0:00 hook</text>
    <text x="43" y="204" fill="#64748B" font-size="9">Prompt P26: Vertical Video Micro-Loop Extractor</text>
  </g>

  <!-- BRANCH 2 (BOTTOM-LEFT): TIER 2 CAROUSELS & THREADS (ASSETS 04-07) -->
  <g filter="url(#card-shadow)">
    <rect x="25" y="272" width="230" height="148" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="25" y="272" width="230" height="28" rx="6" fill="#D97706"/>
    <text x="35" y="290" fill="#FFFFFF" font-size="10.5" font-weight="700">2. CAROUSELS &amp; THREADS (04–07)</text>
    <text x="35" y="315" fill="#0F172A" font-size="10" font-weight="700">• Assets 04–05: 2x PDF Carousels (8–10p):</text>
    <text x="43" y="329" fill="#1E293B" font-size="9.5">LinkedIn &amp; IG (1080x1350, &lt;= 28 words/slide)</text>
    <text x="43" y="343" fill="#64748B" font-size="9">Prompt P27: 10-Slide Carousel Architect</text>
    <text x="35" y="363" fill="#0F172A" font-size="10" font-weight="700">• Assets 06–07: 2x Multi-Post Threads:</text>
    <text x="43" y="377" fill="#1E293B" font-size="9.5">X/Twitter &amp; Threads (8–10 posts, &lt;= 260 chars)</text>
    <text x="43" y="391" fill="#D97706" font-size="9" font-weight="700">Bookmark-worthy diagram in Post #3 / #5</text>
    <text x="43" y="405" fill="#64748B" font-size="9">Prompt P28: High-Velocity Thread Deconstructor</text>
  </g>

  <!-- BRANCH 3 (TOP-RIGHT): TIER 3 TEXT POSTS & MICRO-NOTES (ASSETS 08-13) -->
  <g filter="url(#card-shadow)">
    <rect x="645" y="72" width="230" height="142" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="645" y="72" width="230" height="28" rx="6" fill="#4F46E5"/>
    <text x="655" y="90" fill="#FFFFFF" font-size="10.5" font-weight="700">3. AUTHORITY POSTS &amp; NOTES (08–13)</text>
    <text x="655" y="115" fill="#0F172A" font-size="10" font-weight="700">• Assets 08–10: 3x LinkedIn Text Posts:</text>
    <text x="663" y="129" fill="#1E293B" font-size="9.5">150–210 char "See More" cliffhanger fold</text>
    <text x="663" y="143" fill="#64748B" font-size="9">Myth-Buster, Diagnostic Checklist, Case Audit</text>
    <text x="655" y="162" fill="#0F172A" font-size="10" font-weight="700">• Assets 11–13: 3x Short-Form Notes:</text>
    <text x="663" y="176" fill="#1E293B" font-size="9.5">Substack Notes, X Single-Posts &amp; YT Community</text>
    <text x="663" y="190" fill="#4F46E5" font-size="9" font-weight="600">Zero external links in feed body (Comment/DM)</text>
    <text x="663" y="204" fill="#64748B" font-size="9">Prompt P29: Authority Post &amp; Note Generator</text>
  </g>

  <!-- BRANCH 4 (BOTTOM-RIGHT): TIER 4 OWNED MEDIA & AUDIO (ASSETS 14-15) -->
  <g filter="url(#card-shadow)">
    <rect x="645" y="272" width="230" height="148" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="645" y="272" width="230" height="28" rx="6" fill="#0D9488"/>
    <text x="655" y="290" fill="#FFFFFF" font-size="10.5" font-weight="700">4. OWNED MEDIA &amp; AUDIO (14–15)</text>
    <text x="655" y="315" fill="#0F172A" font-size="10" font-weight="700">• Asset 14: 1x Flagship Newsletter Issue:</text>
    <text x="663" y="329" fill="#1E293B" font-size="9.5">1,200–1,800w Deep-Dive + 3 Direct Funnel CTAs</text>
    <text x="663" y="343" fill="#0D9488" font-size="9" font-weight="700">Target Open Rate &gt;= 45% | Click Rate &gt;= 4.5%</text>
    <text x="655" y="363" fill="#0F172A" font-size="10" font-weight="700">• Asset 15: 1x Syndicated Podcast Audio:</text>
    <text x="663" y="377" fill="#1E293B" font-size="9.5">-14 LUFS Master Audio + Timestamp Show Notes</text>
    <text x="663" y="391" fill="#1E293B" font-size="9.5">Spotify, Apple Podcasts &amp; Substack Audio RSS</text>
    <text x="663" y="405" fill="#64748B" font-size="9">Prompt P30: Newsletter &amp; Show-Notes Synthesizer</text>
  </g>

  <!-- Bottom Schedule Bar -->
  <rect x="25" y="432" width="850" height="28" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="40" y="450" fill="#0F172A" font-size="10" font-weight="700">7-DAY ROLLOUT CADENCE:</text>
  <text x="195" y="450" fill="#4F46E5" font-size="9.5" font-weight="600">Tue: Pillar + Podcast + Thread #1 + Short #1 | Wed: Carousel #1 + Note #1 | Thu: Newsletter + LI Post #1 + Short #2 | Fri–Mon: Remaining 7 Assets</text>
</svg>
