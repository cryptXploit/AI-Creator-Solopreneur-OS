<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <filter id="node-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Pure White Canvas -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <rect x="10" y="10" width="880" height="460" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="10" y="10" width="880" height="48" rx="8" fill="#0F172A"/>
  <text x="28" y="33" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 05 DECISION TREE: 90-SECOND RETENTION PACING &amp; VOICE DNA QA GATE</text>
  <text x="28" y="49" fill="#94A3B8" font-size="10.5" font-weight="500">Deterministic Script Verification Protocol | Thresholds: Hook &lt;= 45s | Reset &lt;= 90s | V_DNA &gt;= 0.90 | SRVAS &gt;= 75.0</text>
  <rect x="735" y="21" width="138" height="26" rx="4" fill="#4F46E5"/>
  <text x="804" y="38" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">4-STAGE QA ROUTER</text>

  <!-- STEP 0: INPUT NODE -->
  <g filter="url(#node-shadow)">
    <rect x="28" y="82" width="175" height="68" rx="6" fill="#0F172A"/>
    <text x="115" y="103" fill="#0D9488" font-size="9.5" font-weight="700" text-anchor="middle">INPUT DRAFT</text>
    <text x="115" y="120" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">H.E.A.R.T. Pillar Script</text>
    <text x="115" y="136" fill="#CBD5E1" font-size="9.5" text-anchor="middle">(Prompts P21–P23 Output)</text>
  </g>
  <path d="M 203 116 L 238 116" fill="none" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>

  <!-- GATE 1: 45-SECOND HOOK & OPEN LOOP -->
  <g filter="url(#node-shadow)">
    <rect x="242" y="76" width="195" height="80" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="242" y="76" width="195" height="22" rx="4" fill="#4F46E5"/>
    <text x="339" y="91" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 1: HOOK &amp; STAKES AUDIT</text>
    <text x="339" y="111" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Hook &lt;= 120 Words (45s) &amp;</text>
    <text x="339" y="125" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Zero Throat-Clearing Intro?</text>
    <text x="339" y="143" fill="#64748B" font-size="9" text-anchor="middle">Target: H_score &gt;= 80 / 100</text>
  </g>

  <!-- Gate 1 FAIL Loop -->
  <path d="M 339 156 L 339 194" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="348" y="178" fill="#D97706" font-size="9" font-weight="700">NO (FAIL)</text>
  <rect x="242" y="198" width="195" height="54" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="339" y="216" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">REMEDIATION: Cut Intro Fluff</text>
  <text x="339" y="230" fill="#1E293B" font-size="9" text-anchor="middle">Inject Ch 4 Hook Triad + COI Math</text>
  <text x="339" y="243" fill="#D97706" font-size="8.5" font-weight="600" text-anchor="middle">Re-run Prompt P22 Section 1</text>

  <!-- Gate 1 PASS to Gate 2 -->
  <path d="M 437 116 L 478 116" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="457" y="108" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS</text>

  <!-- GATE 2: 90-SECOND PATTERN-INTERRUPT DENSITY -->
  <g filter="url(#node-shadow)">
    <rect x="482" y="76" width="195" height="80" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="482" y="76" width="195" height="22" rx="4" fill="#D97706"/>
    <text x="579" y="91" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 2: 90-SEC PACING GRID</text>
    <text x="579" y="111" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Every 225-Word Block Has</text>
    <text x="579" y="125" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Visual + Acoustic Reset?</text>
    <text x="579" y="143" fill="#64748B" font-size="9" text-anchor="middle">Plus 3 Short-Form Peaks Marked</text>
  </g>

  <!-- Gate 2 FAIL Loop -->
  <path d="M 579 156 L 579 194" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="588" y="178" fill="#D97706" font-size="9" font-weight="700">NO (FAIL)</text>
  <rect x="482" y="198" width="195" height="54" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="579" y="216" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">REMEDIATION: Run Prompt P24</text>
  <text x="579" y="230" fill="#1E293B" font-size="9" text-anchor="middle">Insert [VISUAL/ACOUSTIC/LOOP] Cues</text>
  <text x="579" y="243" fill="#D97706" font-size="8.5" font-weight="600" text-anchor="middle">Eliminate Static Monologue &gt; 90s</text>

  <!-- Gate 2 PASS Routing Down to Gate 3 -->
  <path d="M 677 116 L 780 116 L 780 285 L 200 285 L 200 325" fill="none" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
  <text x="728" y="108" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS -&gt; STAGE 3</text>

  <!-- GATE 3: VOICE DNA & ANTI-SLOP FILTER -->
  <g filter="url(#node-shadow)">
    <rect x="95" y="328" width="215" height="84" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="95" y="328" width="215" height="22" rx="4" fill="#4F46E5"/>
    <text x="202" y="343" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 3: VOICE DNA &amp; SLOP AUDIT</text>
    <text x="202" y="363" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Zero Banned AI Words (S_pen=1.0)</text>
    <text x="202" y="377" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">&amp; Voice DNA Match &gt;= 0.90?</text>
    <text x="202" y="396" fill="#D97706" font-size="9" font-weight="600" text-anchor="middle">If FAIL: Run P25 Surgical Rewrite</text>
  </g>

  <path d="M 310 370 L 368 370" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="339" y="362" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS</text>

  <!-- GATE 4: COMPOSITE SRVAS & NATIVE CTA BRIDGE -->
  <g filter="url(#node-shadow)">
    <rect x="372" y="328" width="215" height="84" rx="6" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="372" y="328" width="215" height="22" rx="4" fill="#0D9488"/>
    <text x="479" y="343" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 4: SRVAS &amp; CTA BRIDGE</text>
    <text x="479" y="363" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Composite SRVAS &gt;= 75.0 &amp;</text>
    <text x="479" y="377" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Zero "In Summary" Telegraph?</text>
    <text x="479" y="396" fill="#64748B" font-size="9" text-anchor="middle">Natural Bridge to Lead Magnet Asset</text>
  </g>

  <path d="M 587 370 L 645 370" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="616" y="362" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS</text>

  <!-- TERMINAL APPROVED NODE -->
  <g filter="url(#node-shadow)">
    <rect x="649" y="324" width="222" height="92" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="2.5"/>
    <rect x="669" y="334" width="182" height="20" rx="4" fill="#0D9488"/>
    <text x="760" y="348" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">APPROVED FOR PRODUCTION</text>
    <text x="760" y="369" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Lock Pillar Script Master</text>
    <text x="760" y="385" fill="#CBD5E1" font-size="9.5" text-anchor="middle">-&gt; Ch 06: 1-to-15 Waterfall</text>
    <text x="760" y="401" fill="#0D9488" font-size="9.5" font-weight="700" text-anchor="middle">-&gt; Ch 07: Batch Capture Sprint</text>
  </g>

  <!-- Bottom Legend Footer -->
  <rect x="28" y="432" width="844" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="42" y="449" fill="#0F172A" font-size="9.5" font-weight="700">QA BENCHMARKS:</text>
  <text x="150" y="449" fill="#4F46E5" font-size="9.5" font-weight="600">Hook Density &gt;= 80</text>
  <text x="275" y="449" fill="#D97706" font-size="9.5" font-weight="600">Max Static Interval = 90s</text>
  <text x="435" y="449" fill="#0D9488" font-size="9.5" font-weight="600">Voice DNA Fidelity &gt;= 0.90</text>
  <text x="605" y="449" fill="#0F172A" font-size="9.5" font-weight="700">SRVAS Release Gate &gt;= 75.0 / 100</text>
</svg>
