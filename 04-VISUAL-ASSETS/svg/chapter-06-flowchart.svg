<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <filter id="node-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Pure White Canvas -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <rect x="10" y="10" width="880" height="460" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="10" y="10" width="880" height="48" rx="8" fill="#0F172A"/>
  <text x="28" y="33" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 06 DECISION TREE: PLATFORM-NATIVE TRANSLATION &amp; DISTRIBUTION ROUTING</text>
  <text x="28" y="49" fill="#94A3B8" font-size="10.5" font-weight="500">Enforcing PNFW = 1.0 Across All 15 Derivatives | Zero Watermark Penalties | Zero External-Link Reach Throttling</text>
  <rect x="735" y="21" width="138" height="26" rx="4" fill="#4F46E5"/>
  <text x="804" y="38" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">CMLR &gt;= 3.50 GATE</text>

  <!-- INPUT SOURCE NODE -->
  <g filter="url(#node-shadow)">
    <rect x="28" y="76" width="175" height="76" rx="6" fill="#0F172A"/>
    <text x="115" y="96" fill="#0D9488" font-size="9.5" font-weight="700" text-anchor="middle">LOCKED SOURCE INPUT</text>
    <text x="115" y="114" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Pillar Master + .SRT</text>
    <text x="115" y="130" fill="#CBD5E1" font-size="9.5" text-anchor="middle">3 Short Peaks Pre-Marked</text>
    <text x="115" y="144" fill="#94A3B8" font-size="8.5" text-anchor="middle">(SRVAS &gt;= 75.0 Verified)</text>
  </g>
  <path d="M 203 114 L 240 114" fill="none" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>

  <!-- GATE 1: VISUAL & ASPECT RATIO TRANSLATION -->
  <g filter="url(#node-shadow)">
    <rect x="244" y="72" width="200" height="84" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="244" y="72" width="200" height="22" rx="4" fill="#4F46E5"/>
    <text x="344" y="87" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 1: ASPECT &amp; WATERMARK QA</text>
    <text x="344" y="107" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Shorts 9:16 Safe-Zone Clean &amp;</text>
    <text x="344" y="121" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Carousels 4:5 (&lt;= 28w/Slide)?</text>
    <text x="344" y="140" fill="#64748B" font-size="9" text-anchor="middle">Zero TikTok/Reels Watermarks</text>
  </g>

  <!-- Gate 1 FAIL -->
  <path d="M 344 156 L 344 192" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="353" y="177" fill="#D97706" font-size="9" font-weight="700">FAIL (PNFW=0.2)</text>
  <rect x="244" y="196" width="200" height="52" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="344" y="214" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">FIX: Re-Export Clean Source</text>
  <text x="344" y="228" fill="#1E293B" font-size="9" text-anchor="middle">Run P26 (Shorts) &amp; P27 (Carousel)</text>
  <text x="344" y="241" fill="#D97706" font-size="8.5" font-weight="600" text-anchor="middle">Center Subject + Safe-Zone Captions</text>

  <!-- Gate 1 PASS -->
  <path d="M 444 114 L 484 114" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="464" y="106" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS</text>

  <!-- GATE 2: TEXT HOOK & FOLD ARCHITECTURE -->
  <g filter="url(#node-shadow)">
    <rect x="488" y="72" width="200" height="84" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="488" y="72" width="200" height="22" rx="4" fill="#D97706"/>
    <text x="588" y="87" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 2: NATIVE HOOK &amp; FOLD QA</text>
    <text x="588" y="107" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">LI Fold &lt;= 210 Chars &amp; X Posts</text>
    <text x="588" y="121" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">&lt;= 260 Chars w/ Standalone Value?</text>
    <text x="588" y="140" fill="#64748B" font-size="9" text-anchor="middle">Prompts P28 (Threads) &amp; P29 (Posts)</text>
  </g>

  <!-- Gate 2 FAIL -->
  <path d="M 588 156 L 588 192" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="597" y="177" fill="#D97706" font-size="9" font-weight="700">FAIL (PNFW=0.5)</text>
  <rect x="488" y="196" width="200" height="52" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="588" y="214" fill="#0F172A" font-size="9.5" font-weight="700" text-anchor="middle">FIX: Rewrite Hook &amp; Line Breaks</text>
  <text x="588" y="228" fill="#1E293B" font-size="9" text-anchor="middle">Strip "New Video Out!" Teaser Copy</text>
  <text x="588" y="241" fill="#D97706" font-size="8.5" font-weight="600" text-anchor="middle">Deliver 100% Zero-Click Value in Feed</text>

  <!-- Gate 2 PASS Routing Down to Gate 3 -->
  <path d="M 688 114 L 785 114 L 785 280 L 195 280 L 195 320" fill="none" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#arrow-indigo)"/>
  <text x="738" y="106" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS -&gt; STAGE 3</text>

  <!-- GATE 3: EXTERNAL LINK SUPPRESSION SHIELD -->
  <g filter="url(#node-shadow)">
    <rect x="85" y="324" width="220" height="88" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="85" y="324" width="220" height="22" rx="4" fill="#4F46E5"/>
    <text x="195" y="339" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 3: LINK SUPPRESSION SHIELD</text>
    <text x="195" y="359" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Zero Outbound URLs in Social</text>
    <text x="195" y="373" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Feed Post Bodies (LI / X / IG)?</text>
    <text x="195" y="391" fill="#0D9488" font-size="9" font-weight="600" text-anchor="middle">Route via 1st Comment / DM Trigger</text>
    <text x="195" y="404" fill="#64748B" font-size="8.5" text-anchor="middle">(Prevents -40% to -60% Reach Penalty)</text>
  </g>

  <path d="M 305 368 L 365 368" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="335" y="360" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS</text>

  <!-- GATE 4: STAGGERED 7-DAY CADENCE & OWNED FUNNEL -->
  <g filter="url(#node-shadow)">
    <rect x="369" y="324" width="220" height="88" rx="6" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="369" y="324" width="220" height="22" rx="4" fill="#0D9488"/>
    <text x="479" y="339" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">GATE 4: 7-DAY CADENCE &amp; EMAIL</text>
    <text x="479" y="359" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Newsletter (P30) + Podcast Audio</text>
    <text x="479" y="373" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">Staggered Across 7-Day Matrix?</text>
    <text x="479" y="391" fill="#1E293B" font-size="9" text-anchor="middle">Min 12h Gap Between Same-Platform</text>
    <text x="479" y="404" fill="#64748B" font-size="8.5" text-anchor="middle">Posts to Prevent Self-Cannibalization</text>
  </g>

  <path d="M 589 368 L 645 368" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="617" y="360" fill="#0D9488" font-size="9" font-weight="700" text-anchor="middle">PASS</text>

  <!-- TERMINAL APPROVED NODE -->
  <g filter="url(#node-shadow)">
    <rect x="649" y="324" width="222" height="88" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="2.5"/>
    <rect x="669" y="334" width="182" height="20" rx="4" fill="#0D9488"/>
    <text x="760" y="348" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">WATERFALL QUEUE ACTIVE</text>
    <text x="760" y="368" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">16 Weekly Assets Locked</text>
    <text x="760" y="384" fill="#CBD5E1" font-size="9.5" text-anchor="middle">PNFW = 1.0 across all 6 channels</text>
    <text x="760" y="400" fill="#0D9488" font-size="9.5" font-weight="700" text-anchor="middle">CMLR &gt;= 3.50 Verified Assets/Hr</text>
  </g>

  <!-- Bottom Telemetry Legend -->
  <rect x="28" y="432" width="844" height="26" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="42" y="449" fill="#0F172A" font-size="9.5" font-weight="700">PNFW WEIGHTS:</text>
  <text x="145" y="449" fill="#0D9488" font-size="9.5" font-weight="700">1.0 = Native Format + Zero Body Links</text>
  <text x="385" y="449" fill="#D97706" font-size="9.5" font-weight="600">0.5 = Unadapted Copy-Paste Text</text>
  <text x="595" y="449" fill="#64748B" font-size="9.5" font-weight="600">0.2 = Watermarked / Raw Link Dump</text>
</svg>
