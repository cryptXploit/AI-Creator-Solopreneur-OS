  <!-- Pure White Canvas Background -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <rect x="10" y="10" width="880" height="460" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <rect x="10" y="10" width="880" height="48" rx="8" fill="#0F172A"/>
  <text x="28" y="33" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.4">CHAPTER 05 SYSTEM MINDMAP: THE H.E.A.R.T. PILLAR SCRIPTING &amp; VOICE DNA ARCHITECTURE</text>
  <text x="28" y="49" fill="#94A3B8" font-size="10.5" font-weight="500">Part II — High-Retention Pillar Scripting | Core Formula: SRVAS = [(0.35H + 0.25P + 0.25A + 0.15T) x V_DNA] / S_pen &gt;= 75.0</text>
  <rect x="742" y="21" width="132" height="26" rx="4" fill="#0D9488"/>
  <text x="808" y="38" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">TARGET APV &gt;= 55%</text>

