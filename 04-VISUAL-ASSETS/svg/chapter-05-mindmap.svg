    <text x="35" y="292" fill="#FFFFFF" font-size="11" font-weight="700">2. ARCHITECTURE &amp; RESET PEAKS</text>
    <text x="35" y="318" fill="#0F172A" font-size="10" font-weight="700">• [A] Architectural Shift (02:30–08:30):</text>
    <text x="43" y="332" fill="#1E293B" font-size="9.5">3-Pillar Named System + Formula + Case Proof</text>
    <text x="43" y="346" fill="#64748B" font-size="9">Prompt P23: High-Retention Prose Expander</text>
    <text x="35" y="366" fill="#0F172A" font-size="10" font-weight="700">• [R] Retention Pattern-Interrupts (90s):</text>
    <text x="43" y="380" fill="#1E293B" font-size="9.5">Visual B-Roll + Acoustic Cadence + Micro-Loops</text>
    <text x="43" y="394" fill="#D97706" font-size="9" font-weight="700">3 Pre-Built 9:16 Short-Form Extraction Peaks</text>
    <text x="43" y="408" fill="#64748B" font-size="9">Prompt P24: 90-Second Reset Injector</text>
  </g>

