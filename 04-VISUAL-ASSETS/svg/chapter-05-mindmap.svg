  <!-- Top-Left Branch (H + E Phases) -->
  <path d="M 355 230 C 310 230, 295 140, 255 140" fill="none" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
  <!-- Bottom-Left Branch (A + R Phases) -->
  <path d="M 355 275 C 310 275, 295 345, 255 345" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
