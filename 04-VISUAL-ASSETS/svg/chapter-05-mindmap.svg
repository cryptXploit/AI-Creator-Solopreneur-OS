    <text x="663" y="146" fill="#0D9488" font-size="9" font-weight="600">Target End-Screen / Lead Magnet CTR &gt;= 4.5%</text>
    <text x="655" y="166" fill="#0F172A" font-size="10" font-weight="700">• 5-Parameter Voice DNA Profile (P21):</text>
    <text x="663" y="180" fill="#1E293B" font-size="9.5">1. Sentence Length Variance (5w vs 24w)</text>
    <text x="663" y="194" fill="#1E293B" font-size="9.5">2. Readability Grade (6–8) &amp; Active Voice</text>
    <text x="663" y="208" fill="#64748B" font-size="9">3. Lexicon Anchors | 4. Contrarian Ratio | 5. Slop Filter</text>
  </g>

  <!-- BRANCH 4 (BOTTOM-RIGHT): SRVAS SCORING & ANTI-SLOP QA -->
  <g filter="url(#card-shadow)">
    <rect x="645" y="274" width="230" height="148" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="645" y="274" width="230" height="28" rx="6" fill="#0F172A"/>
    <text x="655" y="292" fill="#FFFFFF" font-size="11" font-weight="700">4. SRVAS SCORING &amp; ANTI-SLOP QA</text>
    <text x="655" y="318" fill="#0F172A" font-size="10" font-weight="700">• Weighted Retention Components:</text>
    <text x="663" y="332" fill="#1E293B" font-size="9.5">Hook H (35%) + Pacing P (25%) +</text>
    <text x="663" y="346" fill="#1E293B" font-size="9.5">Architecture A (25%) + CTA Bridge T (15%)</text>
    <text x="655" y="366" fill="#0F172A" font-size="10" font-weight="700">• Slop Penalty Factor (S_pen = 1 + 0.15N):</text>
    <text x="663" y="380" fill="#1E293B" font-size="9.5">Each AI cliché drops SRVAS score by 15%</text>
    <text x="663" y="394" fill="#0D9488" font-size="9.5" font-weight="700">Release Gate: SRVAS &gt;= 75.0 &amp; V_DNA &gt;= 0.90</text>
    <text x="663" y="408" fill="#64748B" font-size="9">Prompt P25: Anti-Slop &amp; Conversion Auditor</text>
  </g>

  <!-- Bottom Telemetry Status Bar -->
  <rect x="25" y="432" width="850" height="28" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="40" y="450" fill="#0F172A" font-size="10" font-weight="700">PIPELINE TELEMETRY:</text>
  <text x="165" y="450" fill="#4F46E5" font-size="10" font-weight="600">P21 Voice DNA Extractor -&gt; P22 H.E.A.R.T. Outliner -&gt; P23 Section Drafter -&gt; P24 90s Reset Injector -&gt; P25 SRVAS Auditor</text>
  <text x="860" y="450" fill="#64748B" font-size="9.5" text-anchor="end">Studio OS v3.0</text>
