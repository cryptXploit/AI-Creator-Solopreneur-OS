    <text x="35" y="118" fill="#0F172A" font-size="10" font-weight="700">• [H] Hook Extension (00:00–00:45):</text>
    <text x="43" y="132" fill="#1E293B" font-size="9.5">3-Part Hook Triad + Immediate Proof Credibility</text>
    <text x="43" y="146" fill="#64748B" font-size="9">Zero channel intros; open-loop tension anchor</text>
    <text x="35" y="166" fill="#0F172A" font-size="10" font-weight="700">• [E] Escalation of Stakes (00:45–02:30):</text>
    <text x="43" y="180" fill="#1E293B" font-size="9.5">Cost of Inaction (COI) math + Status-Quo Myth</text>
    <text x="43" y="194" fill="#4F46E5" font-size="9" font-weight="600">Reset #1 at 01:30: Contrarian Data Callout</text>
    <text x="43" y="208" fill="#64748B" font-size="9">Prompt P22: Skeleton &amp; Open-Loop Outliner</text>
  </g>

