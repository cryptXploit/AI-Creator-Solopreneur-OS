  <path d="M 545 230 C 590 230, 605 140, 645 140" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <!-- Bottom-Right Branch (SRVAS Formula & P21-P25 Suite) -->
  <path d="M 545 275 C 590 275, 605 345, 645 345" fill="none" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow-navy)"/>

