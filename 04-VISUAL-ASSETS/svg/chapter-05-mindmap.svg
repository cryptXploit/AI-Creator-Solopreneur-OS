  <g filter="url(#card-shadow)">
    <rect x="645" y="74" width="230" height="142" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="645" y="74" width="230" height="28" rx="6" fill="#0D9488"/>
